<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punk Zen Temple</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Vast+Shadow&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --ink: #111;
      --blue: cornflowerblue;
      --panel: rgba(255, 255, 255, 0.75);
      --shade: rgba(0, 0, 0, 0.06);
      --border: rgba(0, 0, 0, 0.15);
      --blur: blur(14px);
    }

    body {
      margin: 0;
      padding: 0;
      background: #f4f6f8;
      font-family: 'Press Start 2P', cursive;
      color: var(--ink);
      overflow-y: auto;
      height: 100vh;
    }

    /* Background mist */
    .background-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      filter: blur(30px);
      opacity: 0.18;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      animation: float 14s infinite linear;
      background: radial-gradient(
        circle,
        rgba(100,149,237,0.35) 0%,
        rgba(255,255,255,0.1) 40%,
        transparent 70%
      );
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-100vh) rotate(360deg); }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 30px 20px;
      max-width: 1200px;
      margin: auto;
    }

    /* Calligraphy headers */
    .section-header {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 2rem;
      color: var(--blue);
      margin: 30px 0 15px;
      letter-spacing: 1px;
      text-shadow:
        0 0 6px rgba(100, 149, 237, 0.35),
        0 0 18px rgba(100, 149, 237, 0.25);
    }

    /* Tabs */
    .tabs {
      display: flex;
      justify-content: center;
      margin: 20px 0;
      gap: 10px;
    }

    .tab-button {
      padding: 10px 20px;
      background: var(--panel);
      backdrop-filter: var(--blur);
      color: var(--ink);
      border: 1px solid var(--border);
      cursor: pointer;
      font-family: 'Press Start 2P', cursive;
      box-shadow: 0 8px 20px var(--shade);
      transition: all 0.35s ease;
    }

    .tab-button.active {
      background: white;
      color: var(--blue);
      border-color: var(--blue);
      box-shadow:
        0 0 10px rgba(100, 149, 237, 0.5),
        0 0 30px rgba(100, 149, 237, 0.35);
    }

    .tab-button:hover {
      box-shadow:
        0 0 12px rgba(100, 149, 237, 0.45),
        0 0 28px rgba(100, 149, 237, 0.35),
        0 0 60px rgba(100, 149, 237, 0.15);
      transform: translateY(-2px) scale(1.01);
      border-color: var(--blue);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Avatar */
    #user-avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px auto;
      position: relative;
    }

    #avatar-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid var(--blue);
      background: #fff;
      box-shadow: 0 6px 20px var(--shade);
    }

    #avatar-title {
      font-family: 'Vast Shadow', cursive;
      color: var(--blue);
      margin-top: 12px;
      font-size: 1.3em;
      letter-spacing: 1px;
      text-shadow:
        0 0 8px rgba(100, 149, 237, 0.4),
        0 0 22px rgba(100, 149, 237, 0.25);
    }

    /* Drawers */
    .drawer {
      position: fixed;
      top: 0;
      height: 100%;
      width: 300px;
      background: var(--panel);
      backdrop-filter: var(--blur);
      border-right: 1px solid var(--border);
      z-index: 10;
      transition: transform 0.3s ease;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 8px 0 25px var(--shade);
    }

    #left-drawer { left: -300px; }
    #left-drawer.open { transform: translateX(300px); }

    #right-drawer {
      right: -300px;
      border-left: 1px solid var(--border);
      border-right: none;
    }
    #right-drawer.open { transform: translateX(-300px); }

    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.15);
      z-index: 9;
      display: none;
    }
    .drawer-overlay.show { display: block; }

    .friend-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #eee;
      margin: 10px;
      display: inline-block;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 10px var(--shade);
      transition: all 0.35s ease;
    }

    .friend-circle:hover {
      box-shadow:
        0 0 12px rgba(100, 149, 237, 0.45),
        0 0 28px rgba(100, 149, 237, 0.35),
        0 0 60px rgba(100, 149, 237, 0.15);
      transform: translateY(-2px) scale(1.05);
      border-color: var(--blue);
    }

    .friend-circle img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .online-dot {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 10px;
      height: 10px;
      background: var(--blue);
      border-radius: 50%;
      border: 2px solid white;
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      z-index: 11;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal.show { display: flex; }

    .modal-content {
      position: relative;
      background: var(--panel);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      padding: 25px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 30px var(--shade);
      color: var(--ink);
    }

    .close-btn {
      float: right;
      cursor: pointer;
      font-size: 1.5em;
      color: var(--blue);
    }

    /* Auth buttons */
    #auth-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    #auth-buttons button {
      margin: 0;
      padding: 10px 20px;
      background: white;
      color: var(--blue);
      border: 1px solid var(--blue);
      cursor: pointer;
      font-family: 'Press Start 2P', cursive;
      box-shadow: 0 6px 18px var(--shade);
      transition: all 0.35s ease;
    }

    #auth-buttons button:hover {
      background: var(--blue);
      color: white;
      box-shadow:
        0 0 12px rgba(100, 149, 237, 0.45),
        0 0 28px rgba(100, 149, 237, 0.35);
      transform: translateY(-2px);
    }

    /* Panels */
    .paper {
      position: relative;
      background: var(--panel);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      padding: 25px;
      margin: 20px auto;
      max-width: 800px;
      box-shadow: 0 10px 30px var(--shade);
      transition: all 0.35s ease;
    }

    .paper:hover {
      box-shadow:
        0 0 12px rgba(100, 149, 237, 0.45),
        0 0 28px rgba(100, 149, 237, 0.35),
        0 0 60px rgba(100, 149, 237, 0.15);
      transform: translateY(-2px) scale(1.01);
      border-color: var(--blue);
    }

    #signup-message {
      color: var(--blue);
      font-weight: bold;
      margin-top: 10px;
    }

    /* Zen Board */
    #chalkboard {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: var(--blur);
      border: 1px dashed var(--border);
      padding: 18px;
      color: #333;
      box-shadow: 0 8px 20px var(--shade);
    }

    /* Shimmer */
    .paper::after,
    .modal-content::after,
    .drawer::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        transparent 30%,
        rgba(255, 255, 255, 0.25) 45%,
        transparent 60%
      );
      opacity: 0.35;
      pointer-events: none;
      animation: shimmer 8s infinite linear;
    }

    @keyframes shimmer {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }
  </style>
</head>

<body>

  <div class="background-shapes">
    <div class="shape" style="width:200px;height:200px;left:10%;top:70%"></div>
    <div class="shape" style="width:300px;height:300px;left:70%;top:40%"></div>
  </div>

  <div class="container">
    <div id="user-avatar">
      <img id="avatar-img" src="https://placehold.co/100x100" />
      <div id="avatar-title">Punk Zen Temple</div>
    </div>

    <div class="tabs">
      <button class="tab-button active">Temple</button>
      <button class="tab-button">Friends</button>
      <button class="tab-button">Messages</button>
    </div>

    <h2 class="section-header">Temple Notes</h2>

    <div class="paper">
      Welcome to your Glass Cyber Café sanctuary.
    </div>

    <h2 class="section-header">Inner Circle</h2>

    <div class="paper">
      <div class="friend-circle">
        <span class="online-dot"></span>
      </div>
      <div class="friend-circle"></div>
      <div class="friend-circle"></div>
    </div>

    <div id="auth-buttons">
      <button>Login</button>
      <button>Signup</button>
    </div>
  </div>

</body>
</html>
