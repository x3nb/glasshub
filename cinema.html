<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Director's Punk Cut Cinema</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Vast+Shadow&display=swap" rel="stylesheet" />
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0; padding: 0; background: #111; /* dark background for cinema */
  font-family: 'Press Start 2P', cursive;
  color: #eee;
  overflow: hidden;
  border: 20px solid #222;
  box-sizing: border-box;
}

body::before {
  content: "";
  position: fixed;
  top:0; left:0; right:0; bottom:0;
  background: repeating-linear-gradient(
    0deg,
    rgba(255,255,255,0.02),
    rgba(255,255,255,0.02) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  z-index: 2;
}

.content {
  position: relative; z-index: 3;
  max-width: 900px; margin: auto; padding: 20px; display:flex; flex-direction:column; align-items:center;
}

/* Styles omitted for brevity, same as previous sample (keep your cinematic style) */

#user-avatar { /* ... */ }
#avatar-img { /* ... */ }
#avatar-title { /* ... */ }
#auth-buttons { /* ... */ }
button { /* ... */ }
#auth-form { /* ... */ }
#main-content { /* ... */ }
#chat-header { /* ... */ }
#loading { /* ... */ }
#chat { /* ... */ }
.menu { /* ... */ }
#synopsis { /* ... */ }
#musicIcon { /* ... */ }
#musicDrawer { /* ... */ }
</style>
</head>
<body>

<div class="content">
  <!-- Avatar + title -->
  <div id="user-avatar">
    <img id="avatar-img" src="officialsticker.png" alt="User Avatar" />
    <div id="avatar-title">Punk Zen</div>
  </div>

  <!-- Auth buttons -->
  <div id="auth-buttons">
    <button onclick="showSignUp()">Sign Up</button>
    <button onclick="showSignIn()">Log In</button>
  </div>

  <!-- Auth form -->
  <div id="auth-form" style="display:none;">
    <h2>Welcome to the Punk Tribe</h2>
    <input type="text" id="signup-username" placeholder="Choose a username" />
    <input type="email" id="auth-email" placeholder="Email" />
    <input type="password" id="auth-password" placeholder="Password" />
    <button onclick="submitAuth()">Submit</button>
    <button onclick="cancelAuth()">Cancel</button>
    <div id="signup-message"></div>
  </div>

  <!-- Main content -->
  <div id="main-content" style="display:none;">
    <div id="chat-header">Please log in</div>
    <div id="loading">Loading...</div>
    <div id="chat"></div>
    <div class="menu" id="menu"></div>
    <div id="synopsis"></div>
  </div>
</div>

<!-- Music icon, hidden until login -->
<button id="musicIcon" style="display:none;" onclick="toggleMusic()">Music</button>

<!-- Music drawer -->
<div id="musicDrawer" style="display:none;">
  <div>Now Playing: <span id="nowPlaying">-</span></div>
  <button id="music-toggle" onclick="toggleMusic()">Mute</button>
  <audio id="musicPlayer"></audio>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Generate shapes (omitted for brevity, same as previous)
  
  // Initialize Supabase
  const supabaseUrl='https://hwymepujsvfqjkbullaf.supabase.co'; // your URL
  const supabaseKey='your-api-key'; // your API key
  window.supabase=supabase.createClient(supabaseUrl,supabaseKey);

  // Global variables
  window.currentUser=null;
  window.username=null;

  // Show sign up / sign in
  window.showSignUp=()=>{ showAuthForm('signup'); }
  window.showSignIn=()=>{ showAuthForm('signin'); }
  window.cancelAuth=()=>{ document.getElementById('auth-form').style.display='none'; document.getElementById('auth-buttons').style.display='flex'; }

  function showAuthForm(mode){
    document.getElementById('auth-form').style.display='flex';
    document.getElementById('auth-buttons').style.display='none';
    document.querySelector('#auth-form h2').innerText=mode==='signup' ? 'Sign Up' : 'Log In';
    document.getElementById('signup-message').innerText='';
    document.getElementById('signup-username').style.display=mode==='signup'?'block':'none';
  }

  window.submitAuth=async()=>{
    const email=document.getElementById('auth-email').value;
    const password=document.getElementById('auth-password').value;
    const username=document.getElementById('signup-username').value.trim();

    if(!email||!password){ alert('Enter email and password'); return; }
    if(!username && document.querySelector('#auth-form h2').innerText==='Sign Up'){ alert('Choose a username'); return; }

    if(document.querySelector('#auth-form h2').innerText==='Sign Up'){
      // Sign Up
      const { data, error }=await supabase.auth.signUp({ email, password });
      if(error){ alert(error.message); return; }
      const userId=data.user.id;
      await supabase.from('profiles').upsert({ id:userId, username:username });
      document.getElementById('signup-message').innerText='Sign-up successful! Please confirm your email.';
      // Switch to login
      document.getElementById('auth-buttons').innerHTML='<button onclick="showSignIn()">Log In</button>';
      document.getElementById('auth-buttons').style.display='flex';
      document.getElementById('auth-form').style.display='none';
    } else {
      // Log in
      const { data, error }=await supabase.auth.signInWithPassword({ email, password });
      if(error){ alert(error.message); return; }
      // Save current user
      window.currentUser=data.user;
      await fetchAndSetUsername();

      // Show controls
      document.getElementById('musicIcon').style.display='block';
      document.getElementById('musicDrawer').style.display='block';

      // Show main content
      document.getElementById('auth-form').style.display='none';
      document.getElementById('auth-buttons').style.display='none';
      document.getElementById('main-content').style.display='block';

      showGreeting();
    }
  }

  async function fetchAndSetUsername() {
    if(!window.currentUser) return;
    const { data }=await supabase
      .from('profiles')
      .select('username')
      .eq('id', window.currentUser.id)
      .single();
    window.username=data?.username || window.currentUser.email;
  }

  function showGreeting() {
    if(!window.username) fetchAndSetUsername().then(()=>{ updateGreeting(); });
    else { updateGreeting(); }
  }

  function updateGreeting() {
    document.getElementById('chat-header').innerText=`Welcome, ${window.username}!`;
    document.getElementById('loading').style.display='none';
    document.getElementById('chat').innerHTML=`<p>Hello ${window.username}! Welcome to your punk cinema!</p>`;
  }

  // Menu setup
  const menuItems=[
    { title:'ABOUT',link:'https://en.wikipedia.org/wiki/Punk_rock',desc:'Learn about punk' },
    { title:'MUSIC',link:'https://www.punknews.org/',desc:'Discover punk tunes' },
    { title:'SHOP',link:'https://punkclothing.com/',desc:'Get punk fashion' },
    { title:'BLOG',link:'https://punkblog.com/',desc:'Read punk stories' }
  ];
  const menuDiv=document.getElementById('menu');
  menuItems.forEach(i => {
    const m=document.createElement('div');
    m.className='menu-item';
    m.innerText=i.title;
    m.onclick=()=>{ document.getElementById('synopsis').innerHTML=`<p>${i.desc}</p><a href="${i.link}" target="_blank" style="color:#eee;">Visit</a>`; }
    menuDiv.appendChild(m);
  });

  // Atmospheric music playlist
  const tracks=[
    'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
    'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
    'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3'
  ];
  const musicPlayer=document.getElementById('musicPlayer');
  const nowPlaying=document.getElementById('nowPlaying');
  let currentTrack=0;
  let isPlaying=false;

  window.toggleMusic=()=>{
    if(isPlaying){ // pause
      musicPlayer.pause();
      isPlaying=false;
      document.getElementById('music-toggle').innerText='Unmute';
    } else { // play
      if(currentTrack>=tracks.length) currentTrack=0;
      musicPlayer.src=tracks[currentTrack];
      musicPlayer.style.display='block';
      musicPlayer.play();
      isPlaying=true;
      document.getElementById('music-toggle').innerText='Mute';
      document.getElementById('nowPlaying').innerText='Track ' + (currentTrack+1);
    }
  };

  musicPlayer.onended=()=>{
    currentTrack++;
    if(currentTrack<tracks.length){
      musicPlayer.src=tracks[currentTrack];
      musicPlayer.play();
      document.getElementById('nowPlaying').innerText='Track ' + (currentTrack+1);
    } else {
      isPlaying=false;
      document.getElementById('nowPlaying').innerText='-';
    }
  };
});
</script>
</body>
</html>
