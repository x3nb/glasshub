<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punk Zen Temple</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f4f6f8;
      font-family: 'Press Start 2P', cursive;
      height: 100vh;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    #auth-screen {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f8;
      z-index: 100;
    }

    #auth-box {
      background: rgba(255,255,255,0.85);
      padding: 30px;
      border: 1px solid #ccc;
      width: 320px;
      text-align: center;
    }

    #auth-box input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #aaa;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
    }

    #auth-box button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      font-family: 'Press Start 2P', cursive;
      border: 1px solid cornflowerblue;
      background: white;
      color: cornflowerblue;
      cursor: pointer;
    }

    #auth-msg {
      margin-top: 10px;
      font-size: 0.6rem;
      min-height: 1em;
      color: crimson;
      white-space: pre-wrap;
    }

    #app {
      display: none;
      height: 100vh;
      overflow-y: auto;
    }

    .container {
      text-align: center;
      padding: 30px 20px;
      max-width: 1200px;
      margin: auto;
    }

    .section-header {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 2rem;
      color: cornflowerblue;
    }

    .paper {
      background: rgba(255,255,255,0.8);
      border: 1px solid #ccc;
      padding: 25px;
      margin: 20px auto;
      max-width: 800px;
    }

    #logout-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: white;
      color: cornflowerblue;
      border: 1px solid cornflowerblue;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="auth-screen">
    <div id="auth-box">
      <h2 class="section-header">Enter Café</h2>
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button id="login-btn">Login</button>
      <button id="signup-btn">Signup</button>
      <div id="auth-msg"></div>
    </div>
  </div>

  <div id="app">
    <div class="container">
      <h2 class="section-header">Punk Zen Temple</h2>
      <div class="paper">You are now inside the Glass Cyber Café ☕</div>
      <button id="logout-btn">Logout</button>
    </div>
  </div>

  <script>
    console.log("🚀 Script loaded");

    if (!window.supabase) {
      document.getElementById("auth-msg").textContent =
        "❌ Supabase SDK failed to load. Check CDN.";
      throw new Error("Supabase SDK not loaded");
    }

    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    console.log("🔗 Supabase URL:", SUPABASE_URL);

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const SESSION_TIMEOUT = 30 * 60 * 1000;
    let sessionTimer = null;

    const authScreen = document.getElementById("auth-screen");
    const app = document.getElementById("app");
    const authMsg = document.getElementById("auth-msg");

    function showApp() {
      console.log("✅ Showing app");
      authScreen.classList.add("hidden");
      app.style.display = "block";
      startSessionTimer();
    }

    function showAuth() {
      console.log("🔒 Showing auth");
      authScreen.classList.remove("hidden");
      app.style.display = "none";
      clearSessionTimer();
    }

    function startSessionTimer() {
      clearSessionTimer();
      sessionTimer = setTimeout(() => {
        logoutUser(true);
      }, SESSION_TIMEOUT);
    }

    function clearSessionTimer() {
      if (sessionTimer) clearTimeout(sessionTimer);
      sessionTimer = null;
    }

    async function loginUser() {
      authMsg.textContent = "Logging in…";
      console.log("🔐 Login clicked");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        authMsg.textContent = "⚠️ Enter email + password";
        return;
      }

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        console.log("📨 Login response:", data, error);

        if (error) {
          authMsg.textContent = "❌ " + error.message;
        } else {
          authMsg.textContent = "✅ Logged in!";
        }
      } catch (err) {
        console.error("🔥 Login exception:", err);
        authMsg.textContent = "🔥 JS Error: " + err.message;
      }
    }

    async function signupUser() {
      authMsg.textContent = "Signing up…";
      console.log("📝 Signup clicked");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        authMsg.textContent = "⚠️ Enter email + password";
        return;
      }

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password
        });

        console.log("📨 Signup response:", data, error);

        if (error) {
          authMsg.textContent = "❌ " + error.message;
        } else {
          authMsg.textContent =
            "📧 Check your email to confirm signup.";
        }
      } catch (err) {
        console.error("🔥 Signup exception:", err);
        authMsg.textContent = "🔥 JS Error: " + err.message;
      }
    }

    async function logoutUser(auto = false) {
      console.log("🚪 Logging out");
      clearSessionTimer();
      await supabase.auth.signOut();
      showAuth();
      if (auto) alert("☕ Session expired. Please log in again.");
    }

    supabase.auth.onAuthStateChange((event, session) => {
      console.log("🔄 Auth state:", event, session);
      if (session) showApp();
      else showAuth();
    });

    document.getElementById("login-btn").onclick = loginUser;
    document.getElementById("signup-btn").onclick = signupUser;
    document.getElementById("logout-btn").onclick = () => logoutUser(false);

    supabase.auth.getSession().then(({ data, error }) => {
      console.log("📦 Initial session:", data, error);
      if (data?.session) showApp();
      else showAuth();
    });
  </script>

</body>
</html>
