<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punk Zen Temple</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f4f6f8;
      font-family: 'Press Start 2P', cursive;
      height: 100vh;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    #auth-screen {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f8;
      z-index: 100;
    }

    #auth-box {
      background: rgba(255,255,255,0.85);
      padding: 30px;
      border: 1px solid #ccc;
      width: 320px;
      text-align: center;
    }

    #auth-box input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #aaa;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
    }

    #auth-box button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      font-family: 'Press Start 2P', cursive;
      border: 1px solid cornflowerblue;
      background: white;
      color: cornflowerblue;
      cursor: pointer;
    }

    #auth-msg {
      margin-top: 10px;
      font-size: 0.6rem;
      min-height: 1em;
      color: crimson;
      white-space: pre-wrap;
    }

    #app {
      display: none;
      height: 100vh;
      overflow-y: auto;
    }

    .container {
      text-align: center;
      padding: 30px 20px;
      max-width: 1200px;
      margin: auto;
    }

    .section-header {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 2rem;
      color: cornflowerblue;
    }

    .paper {
      background: rgba(255,255,255,0.8);
      border: 1px solid #ccc;
      padding: 25px;
      margin: 20px auto;
      max-width: 800px;
    }

    #logout-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: white;
      color: cornflowerblue;
      border: 1px solid cornflowerblue;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="auth-screen">
    <div id="auth-box">
      <h2 class="section-header">Enter Café</h2>
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button id="login-btn">Login</button>
      <button id="signup-btn">Signup</button>
      <div id="auth-msg"></div>
    </div>
  </div>

  <div id="app">
    <div class="container">
      <h2 class="section-header">Punk Zen Temple</h2>
      <div class="paper">You are now inside the Glass Cyber Café ☕</div>
      <button id="logout-btn">Logout</button>
    </div>
  </div>
   <script>
  const supabase = window.supabase.createClient(
    "https://hwymepujsvfqjkbullaf.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3eW1lcHVqc3ZmcWprYnVsbGFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3MDczOTQsImV4cCI6MjA4NDI4MzM5NH0.V6-Cm331IocSXDqe-v6iAZA3TV1STyEHyQI43lcXU_4"
  );

  const SESSION_TIMEOUT = 30 * 60 * 1000;
  let sessionTimer = null;

  const authScreen = document.getElementById("auth-screen");
  const app = document.getElementById("app");

  // -----------------------------
  // GLASS ALERT SYSTEM
  // -----------------------------
  function showAlert(title, message) {
    const modal = document.createElement("div");
    modal.className = "modal show";
    modal.innerHTML = `
      <div class="modal-content">
        <span class="close-btn" onclick="this.closest('.modal').remove()">×</span>
        <h2 class="section-header">${title}</h2>
        <p>${message}</p>
        <button onclick="this.closest('.modal').remove()">OK</button>
      </div>
    `;
    document.body.appendChild(modal);
  }

  // -----------------------------
  // UI TOGGLING
  // -----------------------------
  function showApp() {
    authScreen.classList.add("hidden");
    app.style.display = "block";
    startSessionTimer();
    bindUserActivity();
  }

  function showAuth() {
    authScreen.classList.remove("hidden");
    app.style.display = "none";
    clearSessionTimer();
  }

  // -----------------------------
  // SESSION TIMER
  // -----------------------------
  function startSessionTimer() {
    clearSessionTimer();
    sessionTimer = setTimeout(() => {
      logoutUser(true);
    }, SESSION_TIMEOUT);
  }

  function clearSessionTimer() {
    if (sessionTimer) clearTimeout(sessionTimer);
    sessionTimer = null;
  }

  function resetSessionTimer() {
    startSessionTimer();
  }

  function bindUserActivity() {
    ["click", "mousemove", "keydown", "scroll", "touchstart"].forEach(evt => {
      document.addEventListener(evt, resetSessionTimer, { passive: true });
    });
  }

  // -----------------------------
  // AUTH ACTIONS
  // -----------------------------
  async function loginUser() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
      showAlert("Missing Fields", "Please enter both email and password ☕");
      return;
    }

    const { error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      showAlert("Login Failed", error.message);
    } else {
      showAlert("Welcome Back", "You’ve entered the Glass Cyber Café ☕");
    }
  }

  async function signupUser() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
      showAlert("Missing Fields", "Please enter both email and password ☕");
      return;
    }

    const { error } = await supabase.auth.signUp({
      email,
      password
    });

    if (error) {
      showAlert("Signup Failed", error.message);
    } else {
      showAlert(
        "Almost There",
        "Check your email to confirm your account 📩"
      );
    }
  }

  async function logoutUser(auto = false) {
    clearSessionTimer();
    await supabase.auth.signOut();
    showAuth();

    if (auto) {
      showAlert(
        "Session Ended",
        "Your café session has expired ☕ Please log in again."
      );
    } else {
      showAlert(
        "Logged Out",
        "You’ve gracefully exited the Glass Cyber Café 🌙"
      );
    }
  }

  // -----------------------------
  // AUTH STATE HANDLING
  // -----------------------------
  supabase.auth.onAuthStateChange((event, session) => {
    if (session) {
      showApp();
    } else {
      showAuth();
    }
  });

  // -----------------------------
  // BUTTON WIRING
  // -----------------------------
  document.getElementById("login-btn").onclick = loginUser;
  document.getElementById("signup-btn").onclick = signupUser;
  document.getElementById("logout-btn").onclick = () => logoutUser(false);

  // -----------------------------
  // INITIAL SESSION CHECK
  // -----------------------------
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) {
      showApp();
    } else {
      showAuth();
    }
  });
</script>
</body>
</html>
